/** ---------------------------------------------------------------------------
 * ESTADO DE VENTANA: recuerda cómo se cerró la ventana y lo restaura.
 * Con privacy.resistFingerprinting activo Firefox NO restaura tamaño ni
 * posición (y nunca restaura pantalla completa): aquí persistimos modo y
 * geometría en prefs notfox.window.* (al cambiar de estado y con un sondeo
 * de respaldo, porque mover la ventana no emite evento) y los aplicamos
 * tras la restauración de sesión. Requiere el autoconfig sin sandbox
 * (general.config.sandbox_enabled=false en local-settings.js) y usa XPCOM
 * directo porque el cfg se evalúa antes de que exista resource://
 * ------------------------------------------------------------------------- */
try {
  const NF_Cc = Components.classes, NF_Ci = Components.interfaces;
  const nfPrefs = NF_Cc["@mozilla.org/preferences-service;1"].getService(NF_Ci.nsIPrefBranch);
  const nfWW = NF_Cc["@mozilla.org/embedcomp/window-watcher;1"].getService(NF_Ci.nsIWindowWatcher);
  const nfObsSvc = NF_Cc["@mozilla.org/observer-service;1"].getService(NF_Ci.nsIObserverService);
  const nfWM = () => NF_Cc["@mozilla.org/appshell/window-mediator;1"].getService(NF_Ci.nsIWindowMediator);
  const NF_P = "notfox.window.";

  const nfMode = (win) => {
    try { return win.document.documentElement.getAttribute("sizemode"); } catch (e) { return null; }
  };

  // Guarda el modo y, en ventana normal, también la geometría (solo si cambia).
  const nfArm = (win) => {
    try {
      if (!win || win.__notfoxStateHooked) return;
      win.__notfoxStateHooked = true;
      let nfLast = null;
      const nfSave = () => {
        try {
          const s = nfMode(win);
          if (!s) return;
          let g = s;
          if (s === "normal") g += "," + win.screenX + "," + win.screenY + "," + win.outerWidth + "," + win.outerHeight;
          if (g === nfLast) return;
          nfLast = g;
          nfPrefs.setCharPref(NF_P + "lastSizemode", s);
          if (s === "normal") {
            nfPrefs.setIntPref(NF_P + "lastX", win.screenX);
            nfPrefs.setIntPref(NF_P + "lastY", win.screenY);
            nfPrefs.setIntPref(NF_P + "lastW", win.outerWidth);
            nfPrefs.setIntPref(NF_P + "lastH", win.outerHeight);
          }
        } catch (e) {}
      };
      win.addEventListener("sizemodechange", nfSave);
      win.addEventListener("fullscreen", nfSave);
      win.addEventListener("resize", nfSave);
      win.setInterval(nfSave, 1500); // respaldo: arrastrar la ventana no emite evento
    } catch (e) {}
  };

  const nfArmAll = () => {
    try {
      const en = nfWM().getEnumerator("navigator:browser");
      while (en.hasMoreElements()) nfArm(en.getNext());
    } catch (e) {}
  };

  // Aplica la geometría guardada manteniendo la ventana dentro del área
  // disponible (por si la pantalla cambió desde que se cerró).
  const nfApplyGeom = (win) => {
    try {
      let w = 0, h = 0;
      try { w = nfPrefs.getIntPref(NF_P + "lastW"); h = nfPrefs.getIntPref(NF_P + "lastH"); } catch (e) { return; }
      if (w < 300 || h < 200) return;
      let x = 0, y = 0;
      try { x = nfPrefs.getIntPref(NF_P + "lastX"); y = nfPrefs.getIntPref(NF_P + "lastY"); } catch (e) {}
      const sc = win.screen;
      const ax = sc.availLeft, ay = sc.availTop, aw = sc.availWidth, ah = sc.availHeight;
      if (w > aw) w = aw;
      if (h > ah) h = ah;
      if (x < ax) x = ax;
      if (y < ay) y = ay;
      if (x + w > ax + aw) x = ax + aw - w;
      if (y + h > ay + ah) y = ay + ah - h;
      win.moveTo(x, y);
      win.resizeTo(w, h);
    } catch (e) {}
  };

  // Ventanas abiertas después de este registro.
  nfWW.registerNotification({
    observe(win, topic) {
      if (topic === "domwindowopened") {
        try {
          win.addEventListener("load", () => {
            try {
              if (win.document.documentElement.localName === "window" &&
                  win.location.href.indexOf("chrome://browser/") === 0) nfArm(win);
            } catch (e) {}
          }, { once: true });
        } catch (e) {}
      }
    }
  });

  // Al arrancar: enganchar las ventanas ya abiertas y restaurar el estado.
  nfObsSvc.addObserver({
    observe() {
      nfArmAll();
      let last = "";
      try { last = nfPrefs.getCharPref(NF_P + "lastSizemode", ""); } catch (e) {}
      const en = nfWM().getEnumerator("navigator:browser");
      while (en.hasMoreElements()) {
        const win = en.getNext();
        try {
          if (last === "fullscreen") win.fullScreen = true;
          else if (last === "maximized") {
            if ((nfMode(win) || "") !== "maximized") win.maximize();
          } else {
            nfApplyGeom(win);
            // por si la restauración de sesión redimensiona después:
            win.setTimeout(() => nfApplyGeom(win), 800);
          }
        } catch (e) {}
      }
    }
  }, "sessionstore-windows-restored", false);

  nfArmAll();
} catch (e) {}
